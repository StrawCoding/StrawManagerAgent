[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "straw-manager-agent"
version = "0.1.0.1"
description = "StrawManagerAgent — Agent Orchestration OS (Architecture Baseline v1.1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StrawCoding" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]
cursor = [
  "cursor-sdk>=0.1.0",
]

[project.scripts]
sma = "sma.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sma*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
